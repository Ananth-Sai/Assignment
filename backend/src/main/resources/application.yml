server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: taskflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskflowdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Uses JWT_SECRET environment variable in production; falls back to safe local dev key (min 256-bit)
    secret: ${JWT_SECRET:TaskFlowLocalDevSecretKeyForJwtSigningMustBeAtLeast32BytesLong2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

